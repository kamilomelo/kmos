name: Kartouche template update check

on:
  schedule:
    - cron: '27 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned Bash template with upstream
        run: ./scripts/check-kartouche-update.sh
