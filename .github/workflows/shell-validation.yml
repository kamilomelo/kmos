name: Shell validation

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Validate tracked Bash scripts
        run: bash scripts/check-shell.sh
      - name: Check embedded Kartouche copies and update-check fixtures
        run: |
          bash -n scripts/check-kartouche-update.sh tests/kartouche-update-check.sh
          ./tests/kartouche-update-check.sh
          ./tests/arch-usb-kartouche.sh
          ./tests/arch-wifi-kartouche.sh
          ./tests/arch-headless-kde-kartouche.sh
          ./tests/arch-kde-finish-kartouche.sh
          ./tests/arch-adopt-headless-kartouche.sh
          ./tests/arch-adopt-pacman-style.sh
          ./tests/arch-installer-kartouche.sh
          ./tests/arch-installer-choices.sh
          ./tests/arch-sddm-black.sh
