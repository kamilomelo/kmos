# kmos Starship preset - Holow TTY Panel
# A more styled Linux-console-safe variant: ASCII only, 16-color names, no truecolor.
# Designed for /dev/tty1-6 and other basic TTY terminals.

'$schema' = 'https://starship.rs/config-schema.json'

# === Format ==============================================
# Panel-style prompt using solid background blocks and ASCII dividers.
# No Nerd Font, powerline, RGB, or Unicode drawing dependency.

format = """
[ ░▒▓█$sudo█▓▒░ ](backa)\
$username\
${custom.cpu_temp}\
$time\
$os\
$hostname\
$localip\
$shell\
$shlvl\
$git_branch\
$git_status\
$git_commit\
$git_metrics\
$package\
$c\
$cpp\
$golang\
$julia\
$nodejs\
$rust\
$typst\
$python\
$conda\
$docker_context\
$container\
$directory\
$battery\
$env_var\
$line_break\
$character\
$cmd_duration
"""

add_newline = false

# === Color palette =======================================
# Keep to terminal color names. These render correctly in the Linux virtual console.

palette = 'holow_tty_panel'

[palettes.holow_tty_panel]
ink      = 'bright-white'
muted    = 'bright-black'
core_bg  = 'black'
git_bg   = 'blue'
tool_bg  = 'cyan'
path_bg  = 'bright-black'
warn_bg  = 'yellow'
bad_bg   = 'red'

black   = 'black'
gray    = 'bright-black'
white   = 'bright-white'
red     = 'red'
orange  = 'bright-red'
yellow  = 'yellow'
green   = 'bright-green'
purple  = 'magenta'
foam    = 'bright-cyan'
teal    = 'cyan'
steel   = 'bright-blue'
blue    = 'blue'

# === Core/session panel ==================================

[username]
disabled = false
show_always = true
style_user = 'fg:ink bold'
style_root = 'fg:yellow bold'
format = '[ $user ]($style)'

[sudo]
disabled = false
symbol = 'SUDO'
style = 'fg:yellow bold'
format = '[ $symbol ]($style)'

[custom.cpu_temp]
disabled = false
command = """
sensors | awk '
/^Core 0:/ || /^Package id 0:/ || /^Tctl:/ {
  t = $2
  n = t
  gsub(/[^0-9.]/, "", n)

  if (n < 60) exit

  if (n < 72) {
    color = "\\033[33m"
    label = "TEMP"
  } else {
    color = "\\033[31m"
    label = "HOT"
  }

  printf "%s %s %s \\033[39m\\n", color, label, t
  exit
}
'
"""
when = 'command -v sensors > /dev/null 2>&1'
style = 'fg:yellow bold'
format = '[$output]($style)'

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:ink bold'
format = '[ $time ]($style)'

[os]
disabled = false
style = 'fg:ink bold'
format = '[ $symbol ]($style)'

[os.symbols]
Arch       = 'arch'
RockyLinux = 'rocky'
Debian     = 'deb'
Windows    = 'win'
Android    = 'and'
Linux      = 'linux'
Ubuntu     = 'ubu'

# === Remote/shell panel ==================================

[hostname]
disabled = false
ssh_only = true
ssh_symbol = 'ssh:'
style = 'fg:ink bold'
format = '[ $ssh_symbol$hostname ]($style)'

[localip]
disabled = false
ssh_only = true
style = 'fg:ink bold'
format = '[ $localipv4 ]($style)'

[shell]
disabled = false
bash_indicator = 'bash'
zsh_indicator = 'zsh'
fish_indicator = 'fish'
powershell_indicator = 'psh'
unknown_indicator = 'sh'
style = 'fg:ink bold'
format = '[ $indicator ]($style)'

[shlvl]
disabled = false
threshold = 3
symbol = 'lvl'
style = 'fg:ink bold'
format = '[ $symbol:$shlvl ]($style)'

# === Git panel ===========================================

[git_branch]
disabled = false
symbol = 'git:'
style = 'fg:ink bold'
format = '[ $symbol$branch ]($style)'

[git_status]
disabled = false
style = 'fg:ink bold'
format = '[($all_status$ahead_behind )]($style)'

[git_commit]
disabled = false
tag_disabled = false
only_detached = false
style = 'fg:ink bold'
commit_hash_length = 4
tag_symbol = ' tag:'
format = '[($hash$tag )]($style)'

[git_metrics]
disabled = false
only_nonzero_diffs = false
added_style = 'fg:ink bold'
deleted_style = 'fg:ink bold'
format = '[+$added]($added_style)[ -$deleted ]($deleted_style)'

# === Toolchain panel =====================================

[package]
disabled = false
symbol = 'pkg:'
style = 'fg:ink bold'
format = '[ $symbol$version ]($style)'

[c]
disabled = false
symbol = 'C:'
style = 'fg:ink bold'
format = '[ $symbol$version ]($style)'

[cpp]
disabled = false
symbol = 'C++:'
style = 'fg:ink bold'
format = '[ $symbol$version ]($style)'

[golang]
disabled = false
symbol = 'go:'
style = 'fg:ink bold'
format = '[ $symbol$version ]($style)'

[julia]
disabled = false
symbol = 'jl:'
style = 'fg:ink bold'
format = '[ $symbol$version ]($style)'

[nodejs]
disabled = false
symbol = 'node:'
style = 'fg:ink bold'
format = '[ $symbol$version ]($style)'

[rust]
disabled = false
symbol = 'rs:'
style = 'fg:ink bold'
format = '[ $symbol$version ]($style)'

[typst]
disabled = false
symbol = 'typ:'
style = 'fg:ink bold'
format = '[ $symbol$version ]($style)'

[python]
disabled = false
symbol = 'py:'
style = 'fg:ink bold'
format = '[ $symbol$version( venv:$virtualenv) ]($style)'

[conda]
symbol = 'conda:'
style = 'fg:ink bold'
format = '[($symbol$environment )]($style)'
ignore_base = false

[docker_context]
disabled = false
symbol = 'docker:'
style = 'fg:ink bold'
only_with_files = false
format = '[($symbol$context )]($style)'

[container]
disabled = false
symbol = 'ctr:'
style = 'fg:ink bold'
format = '[($symbol$name )]($style)'

# === Path/status panel ===================================

[directory]
disabled = false
truncation_length = 3
truncation_symbol = '../'
home_symbol = '~'
read_only = ' ro'
read_only_style = 'fg:red bold'
style = 'fg:ink bold'
format = '[ $path]($style)[($read_only)]($read_only_style)[ ]($style)'

[directory.substitutions]
'kDrive' = 'kDrive'
'KM-RoBoTa-Drive' = 'KM-R-Drive'
'KM-RoBoTa' = 'KM-R'
'accounting and finance' = 'acct-fin'
'human resources' = 'hr'
'management' = 'mgmt'
'operations' = 'ops'
'research and development' = 'rnd'
'sales and marketing' = 'sales-mkt'
'Documents' = 'docs'
'Downloads' = 'dl'
'Music' = 'music'
'Pictures' = 'pics'
'Repository' = 'repo'

[battery]
disabled = false
full_symbol = 'bat:full '
charging_symbol = 'bat:chg '
empty_symbol = 'bat:empty '
format = '[$symbol$percentage ]($style)'

[[battery.display]]
threshold = 81
style = 'fg:green bold'
discharging_symbol = 'bat:'

[[battery.display]]
threshold = 63
style = 'fg:yellow bold'
discharging_symbol = 'bat:'

[[battery.display]]
threshold = 45
style = 'fg:bright-red bold'
discharging_symbol = 'bat!'

[[battery.display]]
threshold = 27
style = 'fg:red bold'
discharging_symbol = 'bat!!'

# === Prompt character ====================================

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[ >](bold fg:green)'
error_symbol = '[ !](bold fg:red)'
vimcmd_symbol = '[ N](bold fg:green)'
vimcmd_replace_one_symbol = '[ R](bold fg:purple)'
vimcmd_replace_symbol = '[ RR](bold fg:purple)'
vimcmd_visual_symbol = '[ V](bold fg:yellow)'

[cmd_duration]
disabled = false
show_milliseconds = true
show_notifications = false
min_time = 3_000
style = 'fg:bright-black'
format = '[ $duration ]($style)'
